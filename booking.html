<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Apex Barber Lounge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121212; color: #e0e0e0; line-height: 1.6; }
        nav { background-color: #1a1a1a; display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; border-bottom: 2px solid #d4af37; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #d4af37; text-transform: uppercase; text-decoration: none; }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-weight: 500; }
        .nav-links a:hover { color: #d4af37; }
        .container { padding: 60px 20px; max-width: 600px; margin: 0 auto; }
        h1 { color: #d4af37; font-size: 2.2rem; margin-bottom: 20px; text-align: center; text-transform: uppercase; }
        form { background-color: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #fff; font-weight: 500; }
        input, select { width: 100%; padding: 12px; background-color: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { width: 100%; background-color: #d4af37; color: #000; padding: 14px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        button:hover { background-color: #f1c40f; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Apex Barber</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="booking.html">Book Now</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Book Your Chair</h1>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="(555) 000-0000">
            </div>
            <div class="form-group">
                <label for="service">Select Service</label>
                <select id="service">
                    <option>Signature Haircut ($35)</option>
                    <option>Beard Sculpt & Trim ($25)</option>
                    <option>The Full Package ($55)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Preferred Date</label>
                <input type="date" id="date" required>
            </div>
            <button type="submit">Confirm Reservation</button>
        </form>
    </div>
</body>
</html>
